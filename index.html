  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

a-screen-label=\"About\" style=\"padding:clamp(60px,8vw,96px) clamp(18px,4vw,60px);background:#080a0e\">\n  <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n    <span style=\"width:30px;height:1px;background:#00e5ff;display:block\"><\u002Fspan>\n    <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;color:#00e5ff;text-transform:uppercase\">Profile<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,5vw,68px);letter-spacing:2px;line-height:.95;margin-bottom:46px\">ABOUT<\u002Fh2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,52px);align-items:flex-start\">\n    <div style=\"flex:1 1 440px;min-width:0\">\n      <p style=\"font-size:15px;line-height:1.9;color:#8892aa;margin-bottom:18px;max-width:600px;text-wrap:pretty\">I'm a <strong style=\"color:#e8eaf0;font-weight:500\">backend engineer<\u002Fstrong> who likes systems that stay calm under load. Queues, streams, and services where a hundred milliseconds is a design constraint rather than a rounding error.<\u002Fp>\n      <p style=\"font-size:15px;line-height:1.9;color:#8892aa;margin-bottom:18px;max-width:600px;text-wrap:pretty\">At Fayble I owned the <strong style=\"color:#e8eaf0;font-weight:500\">audio side of an AI commentary system<\u002Fstrong>. Two synthetic commentators, an intensity model driven by game state, and per play speech stitched into continuous broadcast output. The interesting part was never the prompt, it was the latency budget. I benchmarked providers, cut a TTS call per sentence down to one per play, and got generation roughly three times faster without losing the live feel.<\u002Fp>\n      <p style=\"font-size:15px;line-height:1.9;color:#8892aa;max-width:600px;text-wrap:pretty\">Lately I've been building in <strong style=\"color:#e8eaf0;font-weight:500\">Java and Spring Boot<\u002Fstrong> alongside Python, mostly event-driven services with Kafka, Postgres and Redis behind them. M.S. in Computer Science from UT Arlington. Off hours I'm on LeetCode or pulling apart whatever showed up in the data and AI space that week.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:1px;background:#1e2740;border:1px solid #1e2740\">\n      <div style=\"background:#111620;padding:18px 22px\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#00e5ff;text-transform:uppercase;margin-bottom:6px\">Focus<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px\">Backend &amp; Real-Time Systems<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#111620;padding:18px 22px\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#00e5ff;text-transform:uppercase;margin-bottom:6px\">Based In<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px\">Mumbai, India<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#111620;padding:18px 22px\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#00e5ff;text-transform:uppercase;margin-bottom:6px\">Education<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px\">M.S. Computer Science<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#111620;padding:18px 22px\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;text-transform:uppercase;margin-bottom:6px\">Currently<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#27c93f;animation:pulse 2s infinite;display:block\"><\u002Fspan>Open To Opportunities<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\ aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">TENSORFLOW<\u002Fbutton>\n        <button data-tag=\"sklearn\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">SCIKIT-LEARN<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#111620;padding:24px 22px\">\n      <div style=\"font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:#ffe600;margin-bottom:14px\">FRONTEND<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n        <button data-tag=\"react\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">REACT<\u002Fbutton>\n        <button data-tag=\"chartjs\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">CHART.JS<\u002Fbutton>\n        <button data-tag=\"html\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">HTML/CSS<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#111620;padding:24px 22px\">\n      <div style=\"font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:#ffe600;margin-bottom:14px\">CLOUD &amp; TOOLS<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n        <button data-tag=\"aws\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">AWS<\u002Fbutton>\n        <button data-tag=\"docker\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">DOCKER<\u002Fbutton>\n        <button data-tag=\"git\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">GIT<\u002Fbutton>\n        <button data-tag=\"linux\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">LINUX<\u002Fbutton>\n        <button data-tag=\"ffmpeg\" sc-camel-on-click=\"{{ onTag }}\" style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid #1e2740;color:#8892aa;cursor:pointer\" style-hover=\"border-color:#00e5ff;color:#00e5ff\">FFMPEG<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <a href=\"https://leetcode.com/u/anuragb2901/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:block;max-width:500px;border:1px solid #1e2740;line-height:0;overflow:hidden\" style-hover=\"border-color:#00e5ff\">\n    <img src=\"eebc4c2d-979e-45c2-860c-e2371a33b1a2\" alt=\"LeetCode stats\" width=\"500\" height=\"200\" loading=\"lazy\" style=\"width:100%;height:auto;display:block\">\n  <\u002Fa>\n<\u002Fsection>\n\n<section id=\"projects\" data-screen-label=\"Projects\" style=\"padding:clamp(60px,8vw,96px) clamp(18px,4vw,60px);background:#0d1117;border-top:1px solid #1e2740\">\n  <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n    <span style=\"width:30px;height:1px;background:#00e5ff;display:block\"><\u002Fspan>\n    <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;color:#00e5ff;text-transform:uppercase\">Selected Work<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px\">\n    <h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,5vw,68px);letter-spacing:2px;line-height:.95\">PROJECTS<\u002Fh2>\n    <button ref=\"{{ chipRef }}\" sc-camel-on-click=\"{{ clearFilter }}\" style=\"display:none;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:#080a0e;background:#ffe600;border:none;padding:9px 14px;cursor:pointer\">FILTER: ALL ✕<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div ref=\"{{ gridRef }}\" style=\"display:flex;flex-direction:column;gap:1px;background:#1e2740;border:1px solid #1e2740\">\n\n    <article data-proj=\"1\" data-tech=\"python fastapi kafka websockets sqlite react\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">01<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">REAL-TIME EVENT STREAMING PIPELINE<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">PYTHON · FASTAPI · KAFKA · WEBSOCKETS · SQLITE<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Sports feeds arrive as unordered, duplicated JSON dumps. Clients need them as an ordered live stream, replayable on demand at either real-time pace or as fast as the machine allows.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Dedup key (game_id, message_num) at the consumer, not the producer, so replays stay idempotent.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Two producers instead of one flag-heavy producer: blast for tests, timestamp-accurate for demos.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>SQLite over Postgres. A single writer replay store with zero ops for a simulation harness.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">RESULT<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">19 simulated games, ~1,274 messages replayed with ordering preserved; the React scoreboard tracks score, clock and plays over a single WebSocket contract.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">feed.json\n   │\n   ▼\nproducer ──▶ [ kafka: game.events ] ──▶ consumer\n (blast │                                  │\n  or ts-accurate)                   dedup + order\n                                          │\n                                          ▼\n                                      sqlite\n                                          │\n                              FastAPI /events?feed=\n                                          │\n                                  WebSocket push\n                                          │\n                                  React scoreboard<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/Event-streaming\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"2\" data-tech=\"python fastapi redis postgresql docker\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">02<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">DISTRIBUTED TASK SCHEDULER &amp; JOB QUEUE<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">PYTHON · FASTAPI · REDIS · POSTGRESQL<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Long-running work executed inline blocks the request path and dies with the process. Jobs need to be queued, retried, and auditable after the fact.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Redis for the hot queue, Postgres for job history. Fast dispatch, durable audit trail.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Exponential backoff with a capped retry count; permanent failures land in a dead-letter table rather than looping.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Status is a state machine (queued → running → done/failed), so a crashed worker's jobs are recoverable.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">RESULT<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">Requests return immediately instead of waiting on the job; throughput scales with worker count and every execution is queryable by ID.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">POST /jobs\n   │\n   ▼\nFastAPI ──▶ [ redis queue ]\n   │              │\n   │        worker pool ×N\n   │              │\n   │        retry / backoff\n   │              │\n   ▼              ▼\npostgres ◀── job history\n   │\nGET /jobs/{id} → status<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/Task-scheduler\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"3\" data-tech=\"react flask mysql chartjs docker javascript\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">03<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">WORKOUT TRACKER + PROGRESS VISUALIZATION<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">REACT · FLASK · MYSQL · CHART.JS · DOCKER<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Logging sets in a notes app tells you nothing about progression. The data only becomes useful when it's plotted against time and per-exercise volume.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>JWT auth over sessions, so the API stays stateless and the SPA can be hosted separately.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Validation at the API boundary, not the form, so bad data can't enter from any client.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Docker Compose for parity, the same MySQL version locally and in deployment.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">RESULT<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">A deployed full-stack app with authenticated logging and interactive Chart.js dashboards for volume and progression over time.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">React SPA\n   │  JWT\n   ▼\nFlask REST API\n   │   ├─ validation\n   │   └─ auth guard\n   ▼\n MySQL\n   │\n aggregates ──▶ Chart.js\n                dashboards\n\n docker compose up<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/Workout-tracker\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n            <a href=\"https://anuragbhandary.github.io/Workout-tracker/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Live demo\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#ff3c6e;color:#ff3c6e\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\" style=\"display:block;flex:none\"><circle cx=\"8\" cy=\"8\" r=\"6.6\"><\u002Fcircle><path d=\"M1.6 8h12.8M8 1.4c1.8 2 2.6 4.2 2.6 6.6S9.8 12.6 8 14.6C6.2 12.6 5.4 10.4 5.4 8S6.2 3.4 8 1.4z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">LIVE DEMO<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"4\" data-tech=\"python gemini groq elevenlabs ffmpeg\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">04<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">AI SPORTS-COMMENTARY ENGINE<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">PYTHON · GEMINI · GROQ · ELEVENLABS · PYDUB<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Play-by-play data is accurate and lifeless. Turning it into two-voice broadcast audio means generating text and speech inside the gap between plays. That is a latency budget, not a quality contest.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Benchmarked Gemini vs Groq before building around either. Groq came in about 10× faster on text generation.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>One emotion per play instead of per sentence: fewer TTS calls, ~3× faster audio, and the delivery still reads as live.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>A running context object (score, momentum, player form) shapes intensity, so the commentary escalates instead of resetting each play.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">RESULT<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">Dual-commentator audio generated fast enough to sit inside a live event feed, stitched to match footage with ffmpeg.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">event ticker\n   │\n   ▼\ncontext state ──▶ LLM brain\n score/momentum    (groq ~10× )\n   │                  │\n   │             dialogue A/B\n   │                  │\n   │            one emotion/play\n   │                  ▼\n   │            ElevenLabs TTS\n   │                  │\n   └──────▶ pydub mix ──▶ ffmpeg\n                          match audio<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"5\" data-tech=\"python fastapi postgresql redis kafka docker microservices distributed async\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">05<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">COMPLIANCE DOCUMENT PROCESSING PLATFORM<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">PYTHON · FASTAPI · POSTGRESQL · REDIS · KAFKA · DOCKER<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Compliance documents arrive in bursts and take seconds to parse. Doing that inside the request means timeouts, lost uploads, and no record of what happened to a file after it was accepted.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Upload returns a job id immediately. Ingestion, processing, and downstream analysis are decoupled over Kafka topics so any stage can be scaled or replayed on its own.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Redis holds transient job state and caching, Postgres holds extracted metadata and results. Fast reads for status polling, durable storage for anything auditable.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Retries and structured error handling live in the worker, not the API, so a bad document fails loudly in one place instead of silently everywhere.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">STATUS<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">Actively building. Auth, request validation, and processing status APIs are in, worker orchestration is next.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">POST /documents\n   │  auth + validate\n   ▼\nFastAPI ──▶ [ kafka: doc.ingest ]\n   │                 │\n   │           worker pool\n   │           parse / extract\n   │              │      │\n   │          redis    retries\n   │        (job state)  │\n   ▼                     ▼\nGET /documents/{id}   postgres\n     status + results  metadata<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/Compliance-Document-Processing-Platform\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"6\" data-tech=\"java springboot python fastapi kafka postgresql docker microservices distributed sklearn jpa\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">06<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">AI TRANSACTION RISK ANALYSIS PLATFORM<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">JAVA · SPRING BOOT · PYTHON · FASTAPI · KAFKA · POSTGRESQL<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">Transaction APIs want the reliability and tooling of the JVM. Risk models want Python. Forcing either side to move languages costs more than letting them talk.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Polyglot by design. Spring Boot owns transaction APIs, validation, and business rules; a FastAPI service owns risk scoring and anomaly detection.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Kafka between them instead of a synchronous call, so a slow or restarting model service delays scores rather than rejecting payments.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Scores are written back as events. Alerting reads the same stream, which means new consumers can be added without touching the transaction path.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">STATUS<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">Actively building. Spring Boot transaction service and Kafka contracts first, then the scoring service and containerized deployment.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">POST /transactions\n   │\n   ▼\nSpring Boot  ──▶ [ txn.created ]\n rules + JPA           │\n   │                   ▼\n   │            FastAPI risk svc\n   │            anomaly + score\n   │                   │\n   │            [ risk.scored ]\n   ▼                   │\npostgres ◀─────────────┤\n                       ▼\n                  alert consumer<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/AI-Transaction-Risk-Analysis-Platform\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-proj=\"7\" data-tech=\"java springboot postgresql redis kafka junit maven docker jpa hibernate distributed async\" style=\"background:#111620;position:relative;transition:background .25s\">\n      <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:26px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,24px);align-items:center;color:inherit\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,40px);color:#1e2740;line-height:1\">07<\u002Fspan>\n        <span>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,2.4vw,26px);letter-spacing:2px;display:block;margin-bottom:8px\">DISTRIBUTED JOB SCHEDULING &amp; WORKFLOW PLATFORM<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#00e5ff;display:block\">JAVA 17 · SPRING BOOT · POSTGRESQL · REDIS · KAFKA · JUNIT<\u002Fspan>\n        <\u002Fspan>\n        <span data-caret=\"\" style=\"font-family:'Space Mono',monospace;font-size:11px;color:#8892aa;letter-spacing:2px;transition:color .2s\">EXPAND ▾<\u002Fspan>\n      <\u002Fbutton>\n      <div data-details=\"\" style=\"display:none;padding:0 clamp(18px,3vw,32px) 30px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(22px,3vw,32px)\">\n        <div>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">PROBLEM<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px\">A scheduler is easy until there are several workers. Then the hard parts are the ones nobody demos: who owns a job, what happens when a worker dies mid execution, and how a user cancels something already running.<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff3c6e;margin-bottom:8px\">DECISIONS<\u002Fdiv>\n          <ul style=\"list-style:none;font-size:13px;line-height:1.85;color:#8892aa;margin-bottom:18px;display:flex;flex-direction:column;gap:6px\">\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Kafka distributes work, Redis handles distributed coordination and locks. Priorities, retries, and timeouts are scheduler concerns, not something each job reimplements.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Execution history is a first class table with indexes for the queries users actually run, so cancel and monitor are lookups instead of scans.<\u002Fli>\n            <li style=\"padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:#00e5ff\">▸<\u002Fspan>Spring Data JPA and Hibernate for persistence, JUnit and Mockito around the state transitions, because recovery logic is exactly the code you cannot test by hand.<\u002Fli>\n          <\u002Ful>\n          <div style=\"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#ffe600;margin-bottom:8px\">STATUS<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.85;color:#8892aa\">Actively building. Job lifecycle APIs and persistence are in, worker coordination and failure recovery are the current focus.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <pre style=\"font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.7;color:#8892aa;background:#080a0e;border:1px solid #1e2740;padding:18px;overflow-x:auto\">POST /jobs  (schedule)\n   │\n   ▼\nSpring Boot scheduler\n   │  priority + timeout\n   ▼\n[ kafka: job.dispatch ]\n   │            │\nworker A     worker B\n   │            │\n redis locks / leases\n   │            │\n   ▼            ▼\npostgres: execution history\n   │\nGET /jobs/{id} · DELETE /jobs/{id}<\u002Fpre>\n          <div style=\"display:flex;gap:10px;margin-top:16px\">\n            <a href=\"https://github.com/AnuragBhandary/Distributed-Job-Scheduler\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"GitHub repository\" sc-camel-on-mouse-enter=\"{{ iconIn }}\" sc-camel-on-mouse-leave=\"{{ iconOut }}\" style=\"display:inline-flex;align-items:center;border:1px solid #1e2740;color:#e8eaf0;padding:11px 13px;text-decoration:none;transition:border-color .2s,color .2s\" style-hover=\"border-color:#00e5ff;color:#00e5ff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\" style=\"display:block;flex:none\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg><span data-lbl=\"1\" style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .22s,margin-left .3s\">GITHUB<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"education\" data-screen-label=\"Education\" style=\"padding:clamp(60px,8vw,96px) clamp(18px,4vw,60px);background:#080a0e;border-top:1px solid #1e2740\">\n  <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n    <span style=\"width:30px;height:1px;background:#00e5ff;display:block\"><\u002Fspan>\n    <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;color:#00e5ff;text-transform:uppercase\">Academic<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,5vw,68px);letter-spacing:2px;line-height:.95;margin-bottom:46px\">EDUCATION<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:1px;background:#1e2740;border:1px solid #1e2
